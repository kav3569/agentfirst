name: Verify AgentFirst
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  isolated-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: npm ci
      - run: npm run bench:prepare
      - run: docker build -t agentfirst-runner:local -f benchmark/Dockerfile .
      - run: npm run bench:pin-image
      - run: npm run bench:container-calibration
